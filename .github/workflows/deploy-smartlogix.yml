name: Deploy SmartLogix Backend a AWS (Docker + Terraform)

on:
  push:
    branches:
      - deploy
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS Academy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Crear terraform.tfvars desde GitHub Secrets
        run: |
          cat > terraform.tfvars <<EOF
          aws_region           = "us-east-1"
          instance_type        = "t3.large"
          ssh_cidr             = "0.0.0.0/0"
          key_pair_name        = "smartlogix-key"
          public_key           = "${{ secrets.SSH_PUBLIC_KEY }}"
          mysql_root_password  = "${{ secrets.MYSQL_ROOT_PASSWORD }}"
          azure_client_id      = "${{ secrets.AZURE_CLIENT_ID }}"
          azure_tenant_id      = "${{ secrets.AZURE_TENANT_ID }}"
          frontend_url         = "${{ vars.FRONTEND_URL }}"
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Limpiar recursos huérfanos (recuperación de un apply previo interrumpido)
        if: github.event.inputs.action == 'apply'
        run: |
          set +e
          # El state de Terraform es local a este runner efimero (sin backend remoto),
          # asi que si un apply anterior fallo a mitad de camino, estos recursos quedan
          # en AWS pero el state actual no los conoce. En vez de reconciliar cada uno
          # (fragil: rutas, integraciones y stage dependen del orden), se eliminan por
          # completo aqui para que el apply los recree limpios de una sola vez.
          API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='smartlogix-api-gateway'].ApiId" --output text --region us-east-1 2>/dev/null | awk '{print $1}')
          if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
            echo "API Gateway huérfano encontrado ($API_ID) - eliminando"
            aws apigatewayv2 delete-api --api-id "$API_ID" --region us-east-1 || true
          fi
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=smartlogix-sg --query 'SecurityGroups[0].GroupId' --output text --region us-east-1 2>/dev/null)
          if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
            echo "Security group huérfano encontrado ($SG_ID) - revisando interfaces de red dependientes"
            ENI_IDS=$(aws ec2 describe-network-interfaces --filters Name=group-id,Values="$SG_ID" --query 'NetworkInterfaces[].NetworkInterfaceId' --output text --region us-east-1 2>/dev/null)
            for ENI_ID in $ENI_IDS; do
              echo "  Interfaz de red huérfana encontrada ($ENI_ID) - eliminando"
              aws ec2 delete-network-interface --network-interface-id "$ENI_ID" --region us-east-1 || true
            done
            echo "Eliminando security group ($SG_ID)"
            aws ec2 delete-security-group --group-id "$SG_ID" --region us-east-1 || true
          fi
          aws ec2 describe-key-pairs --key-names smartlogix-key --region us-east-1 >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "Key pair huérfano encontrado - eliminando"
            aws ec2 delete-key-pair --key-name smartlogix-key --region us-east-1 || true
          fi
          exit 0

      - name: Terraform Plan
        if: github.event.inputs.action == 'apply'
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Mostrar outputs (IP, URLs del BFF y Eureka)
        if: github.event.inputs.action == 'apply'
        run: terraform output

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve

name: Deploy SmartLogix Backend a AWS (Docker + Terraform)

on:
  push:
    branches:
      - deploy
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS Academy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Crear terraform.tfvars desde GitHub Secrets
        run: |
          cat > terraform.tfvars <<EOF
          aws_region           = "us-east-1"
          instance_type        = "t3.large"
          ssh_cidr             = "0.0.0.0/0"
          key_pair_name        = "smartlogix-key"
          public_key           = "${{ secrets.SSH_PUBLIC_KEY }}"
          mysql_root_password  = "${{ secrets.MYSQL_ROOT_PASSWORD }}"
          azure_client_id      = "${{ secrets.AZURE_CLIENT_ID }}"
          azure_tenant_id      = "${{ secrets.AZURE_TENANT_ID }}"
          frontend_url         = "${{ vars.FRONTEND_URL }}"
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Diagnostico de solo lectura (instancias y ENIs existentes)
        run: |
          set +e
          echo "--- Instancias EC2 (todas, cualquier estado) ---"
          aws ec2 describe-instances --region us-east-1 --query 'Reservations[].Instances[].{ID:InstanceId,State:State.Name,Name:Tags[?Key==`Name`]|[0].Value,SG:SecurityGroups}' --output table
          echo "--- ENIs asociadas a smartlogix-sg ---"
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=smartlogix-sg --query 'SecurityGroups[0].GroupId' --output text --region us-east-1 2>/dev/null)
          aws ec2 describe-network-interfaces --filters Name=group-id,Values="$SG_ID" --region us-east-1 --query 'NetworkInterfaces[].{ENI:NetworkInterfaceId,Status:Status,Attachment:Attachment.InstanceId,Desc:Description}' --output table
          echo "--- IPs publicas y EIPs de instancias running ---"
          aws ec2 describe-instances --region us-east-1 --filters Name=instance-state-name,Values=running --query 'Reservations[].Instances[].{ID:InstanceId,LaunchTime:LaunchTime,PublicIp:PublicIpAddress,PrivateIp:PrivateIpAddress}' --output table
          echo "--- Elastic IPs asignadas ---"
          aws ec2 describe-addresses --region us-east-1 --query 'Addresses[].{PublicIp:PublicIp,InstanceId:InstanceId,AllocationId:AllocationId}' --output table
          exit 0

      - name: Importar recursos existentes en AWS al state de Terraform (idempotencia)
        if: github.event.inputs.action == 'apply'
        run: |
          set +e
          # El state de Terraform es local a este runner efimero (sin backend remoto),
          # asi que en cada ejecucion el state arranca vacio aunque los recursos ya
          # existan en AWS de una corrida anterior. En vez de borrarlos y recrearlos,
          # se importan al state si ya existen, para que terraform apply los reutilice
          # en lugar de fallar intentando crearlos de nuevo.

          echo "--- Security Group (smartlogix-sg) ---"
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=smartlogix-sg --query 'SecurityGroups[0].GroupId' --output text --region us-east-1 2>/dev/null)
          if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
            echo "Security group existente encontrado ($SG_ID) - importando al state"
            terraform import aws_security_group.smartlogix_sg "$SG_ID"
          else
            echo "No existe security group previo - lo creara terraform apply"
          fi

          echo "--- Key Pair (smartlogix-key) ---"
          aws ec2 describe-key-pairs --key-names smartlogix-key --region us-east-1 >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "Key pair existente encontrado - importando al state"
            terraform import aws_key_pair.smartlogix_key smartlogix-key
          else
            echo "No existe key pair previo - lo creara terraform apply"
          fi

          echo "--- Instancia EC2 (smartlogix-backend) ---"
          INSTANCE_ID=$(aws ec2 describe-instances --region us-east-1 \
            --filters Name=tag:Name,Values=smartlogix-backend Name=instance-state-name,Values=pending,running,stopping,stopped \
            --query 'Reservations[0].Instances[0].InstanceId' --output text 2>/dev/null)
          if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
            echo "Instancia EC2 existente encontrada ($INSTANCE_ID) - importando al state"
            terraform import aws_instance.backend "$INSTANCE_ID"
          else
            echo "No existe instancia EC2 previa - la creara terraform apply"
          fi

          echo "--- Elastic IP (smartlogix-backend-eip) ---"
          ALLOC_ID=$(aws ec2 describe-addresses --region us-east-1 \
            --filters Name=tag:Name,Values=smartlogix-backend-eip \
            --query 'Addresses[0].AllocationId' --output text 2>/dev/null)
          if [ -n "$ALLOC_ID" ] && [ "$ALLOC_ID" != "None" ]; then
            echo "Elastic IP existente encontrada ($ALLOC_ID) - importando al state"
            terraform import aws_eip.backend_eip "$ALLOC_ID"
          else
            echo "No existe Elastic IP previa - la creara terraform apply"
          fi

          exit 0

      - name: Terraform Plan
        if: github.event.inputs.action == 'apply'
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Mostrar outputs (IP, URLs del BFF y Eureka)
        if: github.event.inputs.action == 'apply'
        run: terraform output

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy hacia el backend BFF (elimina Mixed Content y CORS)
    location /api/ {
        proxy_pass http://bff:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    # (necesario para React Router en modo BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash en el nombre (JS/CSS del build de CRA)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

server:
  port: 8082

spring:
  application:
    name: ms-pedidos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_pedidos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:smartlogix}
    password: ${SPRING_RABBITMQ_PASSWORD:smartlogix123}

inventario:
  url: ${INVENTARIO_URL:http://localhost:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

mensajeria:
  exchange:
    pedidos: smartlogix.exchange
    dlx: smartlogix.dlx
  colas:
    notificaciones: smartlogix.notificaciones.queue
    dlq-notificaciones: smartlogix.notificaciones.dlq
    envios: smartlogix.envios.queue
    dlq-envios: smartlogix.envios.dlq
  routing-keys:
    pedido-creado: pedido.creado
    pedido-actualizado: pedido.actualizado
    pedido-pattern: pedido.*
    dlq-notificaciones: notificaciones.dead
    dlq-envios: envios.dead


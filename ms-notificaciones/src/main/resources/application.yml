spring:
  application:
    name: ms-notificaciones
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartlogix_notificaciones?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:smartlogix}
    password: ${SPRING_RABBITMQ_PASSWORD:smartlogix123}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

mensajeria:
  exchange:
    pedidos: smartlogix.exchange
    dlx: smartlogix.dlx
  colas:
    notificaciones: smartlogix.notificaciones.queue
    dlq-notificaciones: smartlogix.notificaciones.dlq
  routing-keys:
    notificaciones: pedido.*
    dlq-notificaciones: notificaciones.dead


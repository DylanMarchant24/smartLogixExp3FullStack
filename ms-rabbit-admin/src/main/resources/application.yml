spring:
  application:
    name: ms-rabbit-admin
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:smartlogix}
    password: ${SPRING_RABBITMQ_PASSWORD:smartlogix123}

server:
  port: ${SERVER_PORT:8093}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

mensajeria:
  exchange:
    pedidos: smartlogix.exchange
    dlx: smartlogix.dlx
  colas:
    notificaciones: smartlogix.notificaciones.queue
    dlq-notificaciones: smartlogix.notificaciones.dlq
    envios: smartlogix.envios.queue
    dlq-envios: smartlogix.envios.dlq
  routing-keys:
    pedido-creado: pedido.creado
    pedido-actualizado: pedido.actualizado
    pedido-pattern: pedido.*
    dlq-notificaciones: notificaciones.dead
    dlq-envios: envios.dead


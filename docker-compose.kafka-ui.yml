# SmartLogix EP3 - Kafka UI (brokers, topicos, offsets, lag y consumer groups) (Benjamin Meneses)
# Requiere el cluster levantado: docker compose -f docker-compose.kafka-cluster.yml up -d
# Uso: docker compose -f docker-compose.kafka-ui.yml up -d   ->  http://localhost:8096
name: smartlogix-kafka-ui

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sl3-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_CLUSTER_UI_PORT:-8096}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartlogix-kafka-cluster-3x3
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    networks: [kafka-net]

networks:
  kafka-net:
    name: smartlogix-kafka-net
    external: true

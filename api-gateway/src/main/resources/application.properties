spring.application.name=api-gateway
server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.routes[0].id=bff
spring.cloud.gateway.routes[0].uri=lb://bff
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/bff/**

spring.cloud.gateway.routes[1].id=ms-inventario
spring.cloud.gateway.routes[1].uri=lb://ms-inventario
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/inventario/**

spring.cloud.gateway.routes[2].id=ms-pedidos
spring.cloud.gateway.routes[2].uri=lb://ms-pedidos
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/pedidos/**

spring.cloud.gateway.routes[3].id=ms-envios
spring.cloud.gateway.routes[3].uri=lb://ms-envios
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/envios/**

spring.cloud.gateway.routes[4].id=auth
spring.cloud.gateway.routes[4].uri=lb://bff-smartlogix
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/auth/**

management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always

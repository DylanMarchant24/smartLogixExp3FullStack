spring.application.name=api-gateway
server.port=8085

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# OAuth2 Resource Server - Validacion de JWT emitido por Azure Entra ID (IDaaS)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://login.microsoftonline.com/0d03f96b-5542-4d7d-86fe-546f8f471495/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES:65187167-4bfc-4ef5-a584-4654e7d0612d}

spring.cloud.gateway.routes[0].id=bff
spring.cloud.gateway.routes[0].uri=lb://bff-smartlogix
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/bff/**

spring.cloud.gateway.routes[1].id=ms-inventario
spring.cloud.gateway.routes[1].uri=lb://ms-inventario
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/inventario/**

spring.cloud.gateway.routes[2].id=ms-pedidos
spring.cloud.gateway.routes[2].uri=lb://ms-pedidos
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/pedidos/**

spring.cloud.gateway.routes[3].id=ms-envios
spring.cloud.gateway.routes[3].uri=lb://ms-envios
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/envios/**

spring.cloud.gateway.routes[4].id=auth
spring.cloud.gateway.routes[4].uri=lb://bff-smartlogix
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[5].id=ms-calificaciones
spring.cloud.gateway.routes[5].uri=lb://ms-calificaciones
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/calificaciones/**

spring.cloud.gateway.routes[6].id=ms-proveedores
spring.cloud.gateway.routes[6].uri=lb://ms-proveedores
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/proveedores/**

spring.cloud.gateway.routes[7].id=ms-notificaciones
spring.cloud.gateway.routes[7].uri=lb://ms-notificaciones
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/notificaciones/**

spring.cloud.gateway.routes[8].id=ms-cupones
spring.cloud.gateway.routes[8].uri=lb://ms-cupones
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/cupones/**

spring.cloud.gateway.routes[9].id=ms-sucursales
spring.cloud.gateway.routes[9].uri=lb://ms-sucursales
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/sucursales/**

spring.cloud.gateway.routes[10].id=ms-pagos
spring.cloud.gateway.routes[10].uri=lb://ms-pagos
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/pagos/**

spring.cloud.gateway.routes[11].id=ms-usuarios
spring.cloud.gateway.routes[11].uri=lb://ms-usuarios
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.routes[12].id=ms-auditoria
spring.cloud.gateway.routes[12].uri=lb://ms-auditoria
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/auditoria/**

spring.cloud.gateway.routes[13].id=ms-rabbit-admin
spring.cloud.gateway.routes[13].uri=lb://ms-rabbit-admin
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/rabbit-admin/**

management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://127.0.0.1:4200,*}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,Accept,Origin,X-Requested-With
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# Evita error de CORS duplicado cuando Gateway y BFF agregan headers
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

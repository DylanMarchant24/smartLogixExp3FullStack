server.port=8080
spring.application.name=bff-smartlogix

# URLs de los microservicios downstream (Parametrizadas por env var con fallback local)
inventario.url=${INVENTARIO_URL:http://localhost:8081}
pedidos.url=${PEDIDOS_URL:http://localhost:8082}
envios.url=${ENVIOS_URL:http://localhost:8083}
pagos.url=${PAGOS_URL:http://localhost:8086}
sucursales.url=${SUCURSALES_URL:http://localhost:8087}
proveedores.url=${PROVEEDORES_URL:http://localhost:8089}
calificaciones.url=${CALIFICACIONES_URL:http://localhost:8088}
notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8090}
cupones.url=${CUPONES_URL:http://localhost:8091}
usuarios.url=${USUARIOS_URL:http://localhost:8092}

# Configuración OAuth2 Resource Server (Azure Entra ID / Microsoft OIDC)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/0d03f96b-5542-4d7d-86fe-546f8f471495/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=65187167-4bfc-4ef5-a584-4654e7d0612d

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.org.springframework.security=DEBUG

server.port=8080
spring.application.name=bff-smartlogix

# URLs de los microservicios downstream (Parametrizadas por env var con fallback local)
inventario.url=${INVENTARIO_URL:http://localhost:8081}
pedidos.url=${PEDIDOS_URL:http://localhost:8082}
envios.url=${ENVIOS_URL:http://localhost:8083}

# Configuración OAuth2 Resource Server (Azure Entra ID / Microsoft OIDC)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

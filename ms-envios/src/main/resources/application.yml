server:
  port: 8083

spring:
  application:
    name: ms-envios
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_envios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:smartlogix}
    password: ${SPRING_RABBITMQ_PASSWORD:smartlogix123}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

mensajeria:
  exchange:
    pedidos: smartlogix.exchange
    dlx: smartlogix.dlx
  colas:
    envios: smartlogix.envios.queue
    dlq-envios: smartlogix.envios.dlq
  routing-keys:
    envios: pedido.creado
    dlq-envios: envios.dead


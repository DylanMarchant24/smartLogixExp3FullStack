server.port=8083
spring.application.name=ms-envios

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_envios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:smartlogix}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:smartlogix123}

# --- CONFIGURACIÓN CENTRALIZADA RABBITMQ (Tu parte de la pauta) ---
# Habilitar ACK manual para control de errores y DLQ
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Variables centralizadas de colas y exchanges
mensajeria.exchange.pedidos=smartlogix.exchange
mensajeria.colas.envios=smartlogix.envios.queue
mensajeria.routing-keys.envios=pedido.creado
version: "3.9"

# ==============================================================================
# SmartLogix - Orquestacion completa Cloud Native:
# - Clúster RabbitMQ (2 nodos: rabbitmq-1, rabbitmq-2 con Erlang Cookie compartida)
# - Clúster Apache Kafka (Zookeeper + 2 brokers kafka-1, kafka-2 + kafka-init + kafka-ui)
# - Base de datos MySQL 8.0
# - Backend (14 microservicios Spring Boot + Eureka + API Gateway + BFF)
# - Frontend (SPA servida con Nginx)
# ==============================================================================

services:

  mysql:
    image: mysql:8.0
    container_name: smartlogix-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartlogix-net

  # ── Clúster RabbitMQ (2 Nodos con Erlang Cookie y Management UI) ────────────
  rabbitmq-1:
    image: rabbitmq:3.12-management-alpine
    container_name: smartlogix-rabbitmq
    hostname: rabbitmq-1
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-smartlogix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-smartlogix123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-smartlogix_cluster_cookie}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data-1:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      smartlogix-net:
        aliases:
          - rabbitmq
          - rabbitmq-1

  rabbitmq-2:
    image: rabbitmq:3.12-management-alpine
    container_name: smartlogix-rabbitmq-2
    hostname: rabbitmq-2
    restart: unless-stopped
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-smartlogix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-smartlogix123}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-smartlogix_cluster_cookie}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data-2:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      smartlogix-net:
        aliases:
          - rabbitmq-2

  # ── Arquitectura Apache Kafka (Zookeeper + 2 Brokers + Init + Kafka-UI) ────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: smartlogix-zookeeper
    hostname: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartlogix-net

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: smartlogix-kafka-1
    hostname: kafka-1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${HOST_IP:-localhost}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    volumes:
      - kafka-data-1:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/29092'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    networks:
      - smartlogix-net

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: smartlogix-kafka-2
    hostname: kafka-2
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29093,EXTERNAL://${HOST_IP:-localhost}:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    volumes:
      - kafka-data-2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/29093'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    networks:
      - smartlogix-net

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: smartlogix-kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "=== Inicializando topicos de Apache Kafka para SmartLogix ==="
        kafka-topics --bootstrap-server kafka-1:29092,kafka-2:29093 \
          --create --if-not-exists \
          --topic smartlogix.pedidos.eventos \
          --partitions 3 \
          --replication-factor 2 \
          --config retention.ms=604800000 \
          --config cleanup.policy=delete \
          --config min.insync.replicas=1

        kafka-topics --bootstrap-server kafka-1:29092,kafka-2:29093 \
          --create --if-not-exists \
          --topic smartlogix.envios.tracking \
          --partitions 3 \
          --replication-factor 2 \
          --config retention.ms=604800000 \
          --config cleanup.policy=delete \
          --config min.insync.replicas=1

        echo "=== Topicos de Kafka creados y verificados ==="
        kafka-topics --bootstrap-server kafka-1:29092,kafka-2:29093 --describe --topic smartlogix.pedidos.eventos
        kafka-topics --bootstrap-server kafka-1:29092,kafka-2:29093 --describe --topic smartlogix.envios.tracking
    networks:
      - smartlogix-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: smartlogix-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8095}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartlogix-kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - smartlogix-net

  # ── Microservicios Backend ─────────────────────────────────────────────────
  ms-rabbit-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ms-rabbit-admin
    container_name: smartlogix-ms-rabbit-admin
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_started
      rabbitmq-1:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-smartlogix}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-smartlogix123}
      SERVER_PORT: 8093
    ports:
      - "8093:8093"
    networks:
      - smartlogix-net

  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: discovery-server
    container_name: smartlogix-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - smartlogix-net

  ms-inventario:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ms-inventario
    container_name: smartlogix-ms-inventario
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db_inventario?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
    ports:
      - "8081:8081"
    networks:
      - smartlogix-net

  ms-pedidos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ms-pedidos
    container_name: smartlogix-ms-pedidos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
      rabbitmq-1:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db_pedidos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      INVENTARIO_URL: "http://ms-inventario:8081"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-smartlogix}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-smartlogix123}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-1:29092,kafka-2:29093"
    ports:
      - "8082:8082"
    networks:
      - smartlogix-net

  ms-envios:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ms-envios
    container_name: smartlogix-ms-envios
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
      rabbitmq-1:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db_envios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-smartlogix}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-smartlogix123}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-1:29092,kafka-2:29093"
    ports:
      - "8083:8083"
    networks:
      - smartlogix-net

  ms-auditoria:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ms-auditoria
    container_name: smartlogix-ms-auditoria
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    environment:
      SERVER_PORT: 8094
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db_auditoria?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-1:29092,kafka-2:29093"
    ports:
      - "8094:8094"
    networks:
      - smartlogix-net

  ms-pagos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ms-pagos
    container_name: smartlogix-ms-pagos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db_pagos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
    ports:
      - "8086:8086"
    networks:
      - smartlogix-net

  ms-sucursales:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ms-sucursales
    container_name: smartlogix-ms-sucursales
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db_sucursales?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
    ports:
      - "8087:8087"
    networks:
      - smartlogix-net

  ms-calificaciones:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ms-calificaciones
    container_name: smartlogix-ms-calificaciones
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db_calificaciones?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
    ports:
      - "8088:8088"
    networks:
      - smartlogix-net

  ms-proveedores:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ms-proveedores
    container_name: smartlogix-ms-proveedores
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db_proveedores?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
    ports:
      - "8089:8089"
    networks:
      - smartlogix-net

  ms-notificaciones:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ms-notificaciones
    container_name: smartlogix-ms-notificaciones
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
      rabbitmq-1:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/smartlogix_notificaciones?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-smartlogix}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-smartlogix123}
    ports:
      - "8090:8090"
    networks:
      - smartlogix-net

  ms-cupones:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ms-cupones
    container_name: smartlogix-ms-cupones
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/smartlogix_cupones?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
    ports:
      - "8091:8091"
    networks:
      - smartlogix-net

  ms-usuarios:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ms-usuarios
    container_name: smartlogix-ms-usuarios
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db_usuarios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
    ports:
      - "8092:8092"
    networks:
      - smartlogix-net

  bff:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: bff
    container_name: smartlogix-bff
    restart: unless-stopped
    depends_on:
      - discovery-server
      - ms-inventario
      - ms-pedidos
      - ms-envios
      - ms-auditoria
      - ms-pagos
      - ms-sucursales
      - ms-calificaciones
      - ms-proveedores
      - ms-notificaciones
      - ms-cupones
      - ms-usuarios
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      INVENTARIO_URL: "http://ms-inventario:8081"
      PEDIDOS_URL: "http://ms-pedidos:8082"
      ENVIOS_URL: "http://ms-envios:8083"
      AUDITORIA_URL: "http://ms-auditoria:8094"
      PAGOS_URL: "http://ms-pagos:8086"
      SUCURSALES_URL: "http://ms-sucursales:8087"
      CALIFICACIONES_URL: "http://ms-calificaciones:8088"
      PROVEEDORES_URL: "http://ms-proveedores:8089"
      NOTIFICACIONES_URL: "http://ms-notificaciones:8090"
      CUPONES_URL: "http://ms-cupones:8091"
      USUARIOS_URL: "http://ms-usuarios:8092"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "https://login.microsoftonline.com/${AZURE_TENANT_ID:-0d03f96b-5542-4d7d-86fe-546f8f471495}/v2.0"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: "${AZURE_CLIENT_ID:-65187167-4bfc-4ef5-a584-4654e7d0612d},65187167-4bfc-4ef5-a584-4654e7d0612d"
    ports:
      - "8080:8080"
    networks:
      - smartlogix-net

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    container_name: smartlogix-api-gateway
    restart: unless-stopped
    depends_on:
      - discovery-server
      - bff
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      CORS_ALLOWED_ORIGINS: "${FRONTEND_URL:-http://localhost:3000}"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "https://login.microsoftonline.com/${AZURE_TENANT_ID:-0d03f96b-5542-4d7d-86fe-546f8f471495}/v2.0"
    ports:
      - "8085:8085"
    networks:
      - smartlogix-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
        REACT_APP_AZURE_TENANT_ID: ${AZURE_TENANT_ID}
        REACT_APP_AZURE_REDIRECT_URI: ${FRONTEND_URL}
        REACT_APP_API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    container_name: smartlogix-frontend
    restart: unless-stopped
    depends_on:
      - bff
      - api-gateway
    ports:
      - "3000:3000"
    networks:
      - smartlogix-net

networks:
  smartlogix-net:
    driver: bridge

volumes:
  mysql-data:
  rabbitmq-data-1:
  rabbitmq-data-2:
  zookeeper-data:
  zookeeper-logs:
  kafka-data-1:
  kafka-data-2:

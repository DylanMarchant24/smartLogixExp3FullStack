# SmartLogix EP3 - Cluster Kafka: 3 Zookeeper + 3 brokers + topicos (Benjamin Meneses)
# Independiente del docker-compose.yml principal: proyecto, red, volumenes, contenedores y puertos propios.
# Uso: docker compose -f docker-compose.kafka-cluster.yml up -d
# AWS: export HOST_IP=$(curl -s ifconfig.me) antes de levantar. Puertos externos: 19092, 19093, 19094.
name: smartlogix-kafka-cluster

x-zk-env: &zk-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
  KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,stat,srvr,mntr"
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"

x-zk: &zk
  image: confluentinc/cp-zookeeper:7.5.0
  restart: unless-stopped
  networks: [kafka-net]
  healthcheck:
    test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
    interval: 10s
    timeout: 5s
    retries: 10

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.5.0
  restart: unless-stopped
  networks: [kafka-net]
  depends_on:
    zookeeper-1: {condition: service_healthy}
    zookeeper-2: {condition: service_healthy}
    zookeeper-3: {condition: service_healthy}

services:
  zookeeper-1:
    <<: *zk
    container_name: sl3-zookeeper-1
    hostname: zookeeper-1
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 1
    volumes: [zookeeper-data-1:/var/lib/zookeeper/data, zookeeper-logs-1:/var/lib/zookeeper/log]

  zookeeper-2:
    <<: *zk
    container_name: sl3-zookeeper-2
    hostname: zookeeper-2
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 2
    volumes: [zookeeper-data-2:/var/lib/zookeeper/data, zookeeper-logs-2:/var/lib/zookeeper/log]

  zookeeper-3:
    <<: *zk
    container_name: sl3-zookeeper-3
    hostname: zookeeper-3
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 3
    volumes: [zookeeper-data-3:/var/lib/zookeeper/data, zookeeper-logs-3:/var/lib/zookeeper/log]

  kafka-1:
    <<: *kafka
    container_name: sl3-kafka-1
    hostname: kafka-1
    ports: ["19092:19092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${HOST_IP:-localhost}:19092
    volumes: [kafka-data-1:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-2:
    <<: *kafka
    container_name: sl3-kafka-2
    hostname: kafka-2
    ports: ["19093:19093"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29093,EXTERNAL://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29093,EXTERNAL://${HOST_IP:-localhost}:19093
    volumes: [kafka-data-2:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29093"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-3:
    <<: *kafka
    container_name: sl3-kafka-3
    hostname: kafka-3
    ports: ["19094:19094"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29094,EXTERNAL://0.0.0.0:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29094,EXTERNAL://${HOST_IP:-localhost}:19094
    volumes: [kafka-data-3:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29094"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sl3-kafka-init
    networks: [kafka-net]
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        B=kafka-1:29092,kafka-2:29093,kafka-3:29094
        for T in smartlogix.pedidos.eventos smartlogix.envios.tracking; do
          kafka-topics --bootstrap-server $$B --create --if-not-exists --topic $$T \
            --partitions 3 --replication-factor 3 \
            --config min.insync.replicas=2 \
            --config retention.ms=604800000 \
            --config cleanup.policy=delete
        done
        kafka-topics --bootstrap-server $$B --describe

networks:
  kafka-net:
    name: smartlogix-kafka-net
    driver: bridge

volumes:
  zookeeper-data-1:
  zookeeper-logs-1:
  zookeeper-data-2:
  zookeeper-logs-2:
  zookeeper-data-3:
  zookeeper-logs-3:
  kafka-data-1:
  kafka-data-2:
  kafka-data-3:
